name: Deklaration pruefen
on: [push, pull_request]
jobs:
  validieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema
      - name: Beispiel-Deklaration validieren
        run: python3 werkzeuge/validator.py beispiele/beispiel-deklaration.json
      - name: Konformitaets-Testsuite
        run: python3 werkzeuge/konformitaet.py
